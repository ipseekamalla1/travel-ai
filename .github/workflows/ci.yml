name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  api:
    name: API (lint, types, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: atu
          POSTGRES_PASSWORD: atu
          POSTGRES_DB: atu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atu -d atu_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://atu:atu@localhost:5432/atu_test
      TEST_DATABASE_URL: postgresql+asyncpg://atu:atu@localhost:5432/atu_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests scripts
      - name: Migrations apply from empty and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atu/web lint
      - run: pnpm --filter @atu/web format:check
      - run: pnpm --filter @atu/web typecheck
      - run: pnpm --filter @atu/web test
      - run: pnpm --filter @atu/web build

  types:
    name: Generated API types are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv --directory services/api sync --frozen
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atu/types check

  e2e:
    name: E2E (docker compose stack)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - name: Start stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atu/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @atu/e2e test
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report

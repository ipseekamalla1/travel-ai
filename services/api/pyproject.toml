[project]
name = "atu-api"
version = "0.1.0"
description = "AI Travel Universe API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = []

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "N", "PTH", "TID"]
ignore = ["S101"]  # assert is fine in tests; production code uses explicit errors

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]
"migrations/**" = ["N", "E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires a running PostgreSQL (TEST_DATABASE_URL)",
    "redis: requires a running Redis (TEST_REDIS_URL)",
]
